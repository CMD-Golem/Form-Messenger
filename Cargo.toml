[package]
name = "Form-Messenger"
version = "0.1.3"
edition = "2024"

[dependencies]
axum = { version = "0", default-features = false, features = ["tokio", "http1"]}
http = "1"
lettre = { version = "0", default-features = false, features = ["builder", "rustls-tls", "smtp-transport", "tokio1", "tokio1-rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0", features = ["buffer", "limit"] }
tower-http = { version = "0", features = ["cors"] }